<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="40%" stop-color="#0b1536"/>
      <stop offset="100%" stop-color="#04070f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#3de2ff" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#5d8bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#63e6ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#101a32" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0a1020" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="25%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#020814" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <g opacity="0.14" stroke="#9ecbff" stroke-width="1">
    <path d="M80 0 L80 900"/>
    <path d="M240 0 L240 900"/>
    <path d="M400 0 L400 900"/>
    <path d="M560 0 L560 900"/>
    <path d="M720 0 L720 900"/>
    <path d="M880 0 L880 900"/>
    <path d="M1040 0 L1040 900"/>
    <path d="M1200 0 L1200 900"/>
    <path d="M1360 0 L1360 900"/>
    <path d="M1520 0 L1520 900"/>
    <path d="M0 80 L1600 80"/>
    <path d="M0 220 L1600 220"/>
    <path d="M0 360 L1600 360"/>
    <path d="M0 500 L1600 500"/>
    <path d="M0 640 L1600 640"/>
    <path d="M0 780 L1600 780"/>
  </g>

  <!-- left accent panel -->
  <g transform="translate(90,120)" filter="url(#panelShadow)">
    <rect x="0" y="0" width="760" height="620" rx="28" fill="url(#panelGrad)" stroke="rgba(158,203,255,0.35)"/>
    <rect x="26" y="26" width="708" height="568" rx="22" fill="none" stroke="url(#lineGrad)" stroke-opacity="0.7"/>

    <!-- fake game window -->
    <g transform="translate(66,88)">
      <rect x="0" y="0" width="610" height="350" rx="18" fill="#0f172a" stroke="#5eead4" stroke-opacity="0.5"/>
      <rect x="14" y="14" width="582" height="322" rx="14" fill="#0b1222"/>
      <!-- faux scene -->
      <rect x="35" y="35" width="540" height="280" rx="10" fill="url(#bg)"/>
      <circle cx="150" cy="135" r="62" fill="#f4b5c7" opacity="0.82"/>
      <path d="M95 240 C160 180, 235 180, 275 240 L275 260 L95 260 Z" fill="#89d8ff" opacity="0.8"/>
      <path d="M310 100 L500 100 L540 270 L330 270 Z" fill="#d8b4fe" opacity="0.7"/>
      <path d="M360 120 L480 120 L530 280 L390 280 Z" fill="#f5d0fe" opacity="0.5"/>
      <rect x="46" y="260" width="130" height="42" rx="8" fill="#7dd3fc" opacity="0.4"/>
      <rect x="195" y="242" width="170" height="60" rx="10" fill="#8b5cf6" opacity="0.35"/>
      <rect x="398" y="230" width="130" height="70" rx="12" fill="#67e8f9" opacity="0.32"/>
      <!-- overlay highlight -->
      <rect x="0" y="0" width="610" height="350" rx="18" fill="none" stroke="url(#lineGrad)" stroke-width="2" opacity="0.75"/>
    </g>

    <!-- status mini cards -->
    <g transform="translate(64,500)">
      <rect x="0" y="0" width="200" height="58" rx="12" fill="#101b34" stroke="#7dd3fc" stroke-opacity="0.45"/>
      <text x="20" y="24" fill="#7dd3fc" font-size="12" font-family="Segoe UI,Arial,sans-serif" letter-spacing="1.5">FPS</text>
      <text x="20" y="42" fill="#E6F7FF" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif">120</text>

      <rect x="220" y="0" width="220" height="58" rx="12" fill="#101b34" stroke="#c084fc" stroke-opacity="0.45"/>
      <text x="240" y="24" fill="#c084fc" font-size="12" font-family="Segoe UI,Arial,sans-serif" letter-spacing="1.5">MODE</text>
      <text x="240" y="42" fill="#F1E8FF" font-size="22" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Anime4K + CAS</text>

      <rect x="460" y="0" width="170" height="58" rx="12" fill="#101b34" stroke="#67e8f9" stroke-opacity="0.45"/>
      <text x="480" y="24" fill="#67e8f9" font-size="12" font-family="Segoe UI,Arial,sans-serif" letter-spacing="1.5">RES</text>
      <text x="480" y="42" fill="#E0FBFF" font-size="22" font-weight="700" font-family="Segoe UI,Arial,sans-serif">1600×900</text>
    </g>
  </g>

  <!-- right text area -->
  <g transform="translate(900,170)">
    <text x="0" y="0" fill="#8ee7ff" font-size="22" font-weight="700" font-family="Segoe UI,Arial,sans-serif" letter-spacing="6">WINDOWSCALING</text>
    <rect x="0" y="28" width="300" height="4" rx="2" fill="url(#lineGrad)"/>

    <text x="0" y="150" fill="url(#titleGrad)" font-size="86" font-weight="800" font-family="Segoe UI,Arial,sans-serif" letter-spacing="-2">window</text>
    <text x="0" y="250" fill="url(#titleGrad)" font-size="86" font-weight="800" font-family="Segoe UI,Arial,sans-serif" letter-spacing="-2">Scaling</text>

    <text x="0" y="330" fill="#dbeafe" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="600">Linux / Wayland / Galgame 专属超分放大工具</text>

    <g transform="translate(0,390)" filter="url(#softGlow)">
      <rect x="0" y="0" width="460" height="56" rx="14" fill="#101a33" stroke="#67e8f9" stroke-opacity="0.7"/>
      <text x="26" y="35" fill="#EAFBFF" font-size="24" font-family="Segoe UI,Arial,sans-serif" font-weight="700">GPU 上的图像增强 · 输入无缝重映射</text>
    </g>

    <g transform="translate(0,490)">
      <text x="0" y="0" fill="#bae6fd" font-size="20" font-family="Segoe UI,Arial,sans-serif" font-weight="700">核心能力</text>
      <text x="0" y="40" fill="#dbeafe" font-size="22" font-family="Segoe UI,Arial,sans-serif">• 多算法串联超分渲染</text>
      <text x="0" y="76" fill="#dbeafe" font-size="22" font-family="Segoe UI,Arial,sans-serif">• 全屏覆盖层 &amp; 窗口捕获</text>
      <text x="0" y="112" fill="#dbeafe" font-size="22" font-family="Segoe UI,Arial,sans-serif">• 鼠标 / 触控 1:1 输入回传</text>
      <text x="0" y="148" fill="#dbeafe" font-size="22" font-family="Segoe UI,Arial,sans-serif">• 托盘常驻 &amp; 全局热键控制</text>
    </g>

    <g transform="translate(0,700)">
      <rect x="0" y="0" width="242" height="54" rx="14" fill="url(#lineGrad)"/>
      <text x="26" y="34" fill="#050816" font-size="23" font-weight="800" font-family="Segoe UI,Arial,sans-serif">Linux · Galgame</text>
    </g>
  </g>

  <!-- small corner accents -->
  <g opacity="0.8">
    <circle cx="1468" cy="176" r="94" fill="none" stroke="#7dd3fc" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="1468" cy="176" r="62" fill="none" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="1468" cy="176" r="30" fill="#67e8f9" opacity="0.7"/>
  </g>
</svg>
